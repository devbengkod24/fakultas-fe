  - url: '{{base_url_production}}'
paths:
  /siadin-dsn/login:
    parameters: []
    post:
      summary: Login
      parameters:
        - name: Accept
          in: header
          required: false
          example: '*/*'
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          example: application/json
          schema:
            type: string
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
            example:
              username: 0686.11.2013.536
              password: ini passwordnya
