  /manajemen-skripsi/plot-pembimbing:
    parameters: []
    get:
      summary: Plot Pembimbing
      parameters:
        - name: page
          in: query
          required: false
          example: '1'
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          example: '10'
          schema:
            type: integer
        - name: progdi
          in: query
          required: false
          example: A11
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        nim:
                          type: string
                          example: "A11.2022.14821"
                        pembimbing:
                          type: object
                          properties:
                            nip:
                              type: string
                              example: "0686.11.2004.311"
                            nama:
                              type: string
                              example: "ADI PRIHANDONO"
                            email:
                              type: string
                              example: "adi.prihandono@dsn.dinus.ac.id"
                            gelarDepan:
                              type: string
                              nullable: true
                              example: null
                            gelarBelakang:
                              type: string
                              example: "M.Kom"
                        topik:
                          type: string
                          nullable: true
                          example: null
                        judul:
                          type: string
                          nullable: true
                          example: "PENERAPAN METODE K-MEANS UNTUK CLUSTERISASI DATA PENJUALAN MAKANAN DAN MINUMAN PADA KERTAS KERJA COFFEE SHOP"
                        inputTime:
                          type: string
                          format: date-time
                          example: "2025-07-08T08:39:46"
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Ok"
