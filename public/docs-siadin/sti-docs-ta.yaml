          required: false
          schema:
            type: string
        - name: bidang_kajian
          in: query
          description: Filter berdasarkan bidang kajian
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Berhasil mendapatkan list dosen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Berhasil mendapatkan data dosen"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DosenDetail'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ta/mahasiswa/pengajuan:
