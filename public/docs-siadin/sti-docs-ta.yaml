                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Validasi sidang TA 1"
                  data:
                    type: object
                    properties:
                      validation:
                        type: boolean
                        description: Apakah mahasiswa memenuhi syarat sidang
                        example: true
                      requirements:
                        type: object
                        properties:
                          pengajuan_accepted:
                            type: boolean
                            description: Pengajuan TA sudah di-ACC
                            example: true
