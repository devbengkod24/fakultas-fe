                            type: object
                            properties:
                              current:
                                type: integer
                                example: 8
                              minimum:
                                type: integer
                                example: 6
                              valid:
                                type: boolean
                                example: true
                          logbook_acc:
                            type: boolean
                            description: Semua logbook sudah di-ACC
                            example: true
                      message:
                        type: string
                        nullable: true
                        description: Pesan jika tidak memenuhi syarat
                        example: null
