                      validation: true
                      requirements:
                        pengajuan_accepted: true
                        jumlah_bimbingan:
                          current: 8
                          minimum: 6
                          valid: true
                        logbook_acc: true
                      message: null
                invalidResponse:
                  summary: Invalid - Cannot Submit
                  value:
                    success: true
                    message: "Anda belum memenuhi syarat sidang TA 1"
