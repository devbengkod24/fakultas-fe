  /v2/ta/statistic-krs:
    get:
      tags:
        - Dashboard - Statistics
      summary: Get TA Statistics by KRS Type
      description: |
        Mengambil statistik mahasiswa Tugas Akhir berdasarkan tipe KRS (TA1, TA2, atau TA1 & TA2).
        Endpoint ini digunakan untuk menampilkan chart distribusi mahasiswa berdasarkan jenis KRS yang diambil.
        
        **Penggunaan:**
        - TA1: Mahasiswa yang mengambil Tugas Akhir 1
        - TA2: Mahasiswa yang mengambil Tugas Akhir 2
        - TA1 & TA2: Mahasiswa yang mengambil TA1 dan TA2 bersamaan
        
        **Note:** Endpoint ini menggunakan base URL V2
      responses:
        '200':
          description: Statistik TA berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Statistik TA berhasil diambil"
                  data:
                    type: array
                    description: Array berisi statistik untuk setiap tipe KRS
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          enum: [TA1, TA2, "TA1 & TA2"]
                          description: Tipe KRS Tugas Akhir
                          example: "TA1"
                        value:
                          type: integer
                          description: Jumlah mahasiswa dengan tipe KRS tersebut
                          example: 45
              examples:
                successResponse:
                  summary: Success Response
                  value:
                    success: true
                    message: "Statistik TA berhasil diambil"
                    data:
                      - label: "TA1"
                        value: 45
                      - label: "TA2"
                        value: 38
                      - label: "TA1 & TA2"
                        value: 12
                emptyResponse:
                  summary: Empty Data Response
                  value:
                    success: true
                    message: "Statistik TA berhasil diambil"
                    data: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

