    get:
      tags:
        - Periode Ajaran
      summary: Sync Periode from SIADIN Database
      description: |
        Melakukan sinkronisasi data periode dari database SIADIN utama.
        Digunakan untuk mengambil data periode terbaru dari sistem SIADIN.
        
        **Role Access:** Koordinator
        **Note:** Proses ini akan mengambil data dari database eksternal dan mungkin memakan waktu beberapa detik.
      responses:
        '200':
          description: Sinkronisasi periode berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Sinkronisasi data periode berhasil"
                  data:
                    type: array
                    description: Array periode yang berhasil disinkronkan
                    items:
                      $ref: '#/components/schemas/PeriodeDetail'
              examples:
                successResponse:
                  summary: Success Response with Data
                  value:
                    success: true
                    message: "Sinkronisasi data periode berhasil"
                    data:
                      - id: 12
                        kode_periode: 20252
                        tahun_ajaran: "2025 - 2026 Genap"
                        status: 0
                        tgl_awal: "2026-01-05"
                        tgl_akhir: "2026-06-15"
                        tgl_awal_ta: "2025-12-01"
                        tgl_akhir_ta: "2026-06-30"
                noNewData:
                  summary: No New Data
                  value:
                    success: true
                    message: "Tidak ada data periode baru untuk disinkronkan"
                    data: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          description: Gagal melakukan sinkronisasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Gagal melakukan sinkronisasi"
                error: "Connection timeout ke database SIADIN"

  /v1/periode/{id}/update:
    patch:
      tags:
        - Periode Ajaran
      summary: Update Periode
      description: |
        Mengupdate tanggal periode ajaran (tgl_awal_ta dan tgl_akhir_ta).
        Digunakan untuk menyesuaikan tanggal mulai dan akhir periode Tugas Akhir.
        
        **Role Access:** Koordinator
      parameters:
        - name: id
          in: path
          required: true
          description: ID periode yang akan diupdate
          schema:
            type: integer
            example: 11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tgl_awal_ta
                - tgl_akhir_ta
              properties:
                tgl_awal_ta:
                  type: string
                  format: date
                  description: Tanggal mulai periode Tugas Akhir
                  example: "2025-05-31"
                tgl_akhir_ta:
                  type: string
                  format: date
                  description: Tanggal akhir periode Tugas Akhir
                  example: "2025-08-30"
            examples:
              updateRequest:
                summary: Update Request
                value:
                  tgl_awal_ta: "2025-05-31"
                  tgl_akhir_ta: "2025-08-30"
      responses:
        '200':
          description: Periode berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Periode berhasil diupdate"
                  data:
                    $ref: '#/components/schemas/PeriodeDetail'
        '400':
          description: Request body tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidDate:
                  summary: Invalid Date Range
                  value:
                    success: false
                    message: "Validasi gagal"
                    error: "Tanggal mulai harus lebih awal dari tanggal akhir"
                missingField:
                  summary: Missing Required Field
                  value:
                    success: false
                    message: "Validasi gagal"
                    error: "Field tgl_awal_ta dan tgl_akhir_ta harus diisi"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Periode tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Periode tidak ditemukan"
                error: "Periode dengan ID tersebut tidak ada dalam database"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/periode/{id}/change-status:
    put:
      tags:
        - Periode Ajaran
      summary: Change Periode Status
      description: |
        Mengubah status periode (aktif/tidak aktif).
        Ketika periode diaktifkan, periode lain yang aktif akan otomatis dinonaktifkan.
        Hanya ada satu periode aktif dalam satu waktu.
        
        **Role Access:** Koordinator
        **Note:** Status 1 = Aktif, Status 0 = Tidak Aktif
      parameters:
        - name: id
          in: path
          required: true
          description: ID periode yang akan diubah statusnya
          schema:
            type: integer
            example: 11
      responses:
        '200':
          description: Status periode berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Status periode berhasil diubah"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 11
                      status:
                        type: integer
                        description: Status baru (1=aktif, 0=tidak aktif)
                        example: 1
                      kode_periode:
                        type: integer
                        example: 20251
                      tahun_ajaran:
                        type: string
                        example: "2025 - 2026 Ganjil"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Periode tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Periode tidak ditemukan"
                error: "Periode dengan ID tersebut tidak ada dalam database"
        '500':
          $ref: '#/components/responses/InternalServerError'

