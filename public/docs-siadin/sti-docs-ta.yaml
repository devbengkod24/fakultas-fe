openapi: 3.0.3
info:
  title: STI Tugas Akhir API Documentation
  description: |
    Dokumentasi API untuk modul Tugas Akhir (TA) sistem STI.
    API ini mencakup endpoint untuk manajemen dashboard, pengajuan, logbook, monitoring sidang, dan data mahasiswa.
    
    ## Authentication
    Semua endpoint memerlukan autentikasi menggunakan Bearer Token yang diperoleh dari proses login.
    
  version: 1.0.0
  contact:
    name: Tim Pengembang STI Tugas Akhir
    email: mario.aprilnino27@gmail.com

servers:
  - url: https://api-sti.dinus.id
    description: Production Server
  - url: https://api-dev-sti.dinus.id
    description: Development Server

tags:
  - name: Dashboard - Mahasiswa
    description: Endpoint dashboard untuk role mahasiswa
  - name: Dashboard - Koordinator
    description: Endpoint dashboard untuk role koordinator
  - name: Dashboard - Dosen
    description: Endpoint dashboard untuk role dosen
  - name: Dashboard - Statistics
    description: Endpoint statistik untuk dashboard (V2 API)
  - name: Periode Ajaran
    description: Endpoint untuk manajemen periode ajaran (khusus koordinator)
  - name: Data Mahasiswa
    description: Endpoint untuk manajemen data mahasiswa Tugas Akhir
  - name: Data Mahasiswa V2 - (Koordinator)
    description: Endpoint V2 untuk manajemen data mahasiswa dengan fitur tambahan (sorting, sync yudisium)
  - name: Log Aktivitas
    description: Endpoint untuk melihat log aktivitas dosen dan mahasiswa
  - name: Monitoring Sidang TA 1
    description: Endpoint untuk monitoring dan manajemen sidang Tugas Akhir 1
  - name: Monitoring Sidang TA 2
    description: Endpoint untuk monitoring dan manajemen sidang Tugas Akhir 2
  - name: Logbook Bimbingan
    description: Endpoint untuk manajemen logbook bimbingan mahasiswa TA
  - name: Kuota Dosen
    description: Endpoint untuk manajemen kuota pembimbingan dosen (khusus koordinator)
  - name: Authentication
    description: Endpoint untuk autentikasi dan manajemen profil pengguna
  - name: Link Group
    description: Endpoint untuk manajemen link grup WhatsApp (untuk semua modul TA/KP/BK/Alumni)
  - name: Pengumuman
    description: Endpoint untuk manajemen pengumuman (untuk semua modul TA/KP/BK/Alumni)

security:
  - BearerAuth: []

paths:
  # ==========================================
  # AUTHENTICATION ENDPOINTS
  # ==========================================

  /v1/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: |
        Login untuk mendapatkan access token. 
        Endpoint ini tidak memerlukan Bearer Token.
        Email dan password akan divalidasi untuk autentikasi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "john.doe@mhs.dinus.ac.id"
                  description: Email user yang terdaftar di sistem
                password:
                  type: string
                  format: password
                  example: "password123"
                  description: Password user
                  minLength: 8
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login berhasil"
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: JWT token untuk autentikasi
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type:
                        type: string
                        example: "Bearer"
                      user:
                        $ref: '#/components/schemas/UserProfile'
                      alumni:
                        type: object
                        nullable: true
                        description: Data alumni jika user adalah alumni
                      mitra:
                        type: object
                        nullable: true
                        description: Data mitra jika user adalah mitra
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Unauthorized"
                error: "Email atau password salah"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/profile:
    get:
      tags:
        - Authentication
      summary: Get User Profile
      description: Mendapatkan informasi profil user yang sedang login berdasarkan token
      operationId: getUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil mendapatkan profil user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Berhasil mendapatkan profil"
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Authentication
      summary: Update Password
      description: Mengubah password user yang sedang login
      operationId: updatePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - password
              properties:
                current_password:
                  type: string
                  format: password
                  example: "oldpassword123"
                  description: Password saat ini
                  minLength: 8
                password:
                  type: string
                  format: password
                  example: "newpassword123"
                  description: Password baru (minimal 8 karakter)
                  minLength: 8
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Password berhasil diubah"
        '400':
          description: Validasi gagal atau password saat ini salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongCurrentPassword:
                  summary: Password Saat Ini Salah
                  value:
                    success: false
                    message: "Bad Request"
                    error: "Password saat ini tidak sesuai"
                samePassword:
                  summary: Password Baru Sama dengan Lama
                  value:
                    success: false
                    message: "Bad Request"
                    error: "Password baru harus berbeda dari password saat ini"
                tooShort:
                  summary: Password Terlalu Pendek
                  value:
                    success: false
                    message: "Bad Request"
                    error: "Password minimal 8 karakter"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ta/mahasiswa/update-profile:
    post:
      tags:
        - Authentication
      summary: Update Mahasiswa Profile
      description: Memperbarui profil mahasiswa Tugas Akhir (khusus role mahasiswa)
      operationId: updateMahasiswaProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "John Doe"
                  description: Nama lengkap mahasiswa
                phone:
                  type: string
                  example: "+6281234567890"
                  description: Nomor telepon mahasiswa
                alamat:
                  type: string
                  example: "Jl. Nakula No.5, Semarang"
                  description: Alamat lengkap mahasiswa
                foto:
                  type: string
                  format: uri
                  nullable: true
                  example: "https://example.com/photo.jpg"
                  description: URL foto profil mahasiswa
      responses:
        '200':
          description: Profil mahasiswa berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Profil mahasiswa berhasil diperbarui"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Hanya mahasiswa yang bisa update profil TA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Forbidden"
                error: "Endpoint ini hanya untuk mahasiswa"
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # LINK GROUP ENDPOINTS
  # ==========================================

  /v1/link-group/active-koor:
    get:
      tags:
        - Link Group
        - Koordinator
      summary: Get Link Group Global (Koordinator)
      description: Mendapatkan link grup WhatsApp global untuk koordinator dan mahasiswa
      operationId: getLinkGlobalKoor
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          description: Tipe modul (TA, KP, BK, alumni)
          required: true
          schema:
            type: string
            enum: [TA, KP, BK, alumni]
            example: "TA"
      responses:
        '200':
          description: Berhasil mendapatkan link grup
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Berhasil mendapatkan link grup"
                  data:
                    type: object
                    properties:
                      link:
                        type: string
                        format: uri
                        example: "https://chat.whatsapp.com/xxxxx"
                        description: URL WhatsApp group
                      type:
                        type: string
                        example: "TA"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/link-group/active-dosen:
    get:
      tags:
        - Link Group
        - Dosen
      summary: Get Link Group Dosen
      description: Mendapatkan link grup WhatsApp untuk dosen dan mahasiswa bimbingan
      operationId: getLinkGroupDosen
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          description: Tipe modul (TA, KP, BK, alumni)
          required: true
          schema:
            type: string
            enum: [TA, KP, BK, alumni]
            example: "TA"
      responses:
        '200':
          description: Berhasil mendapatkan link grup dosen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Berhasil mendapatkan link grup dosen"
                  data:
                    type: object
                    properties:
                      link:
                        type: string
                        format: uri
                        example: "https://chat.whatsapp.com/xxxxx"
                        description: URL WhatsApp group dosen
                      type:
                        type: string
                        example: "TA"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/link-group-koor:
    post:
      tags:
        - Link Group
        - Koordinator
      summary: Create/Update Link Group Global
      description: Membuat atau memperbarui link grup WhatsApp global (Koordinator)
      operationId: createLinkGlobalKoor
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - link
              properties:
                type:
                  type: string
                  enum: [TA, KP, BK, alumni]
                  example: "TA"
                  description: Tipe modul
                link:
                  type: string
                  format: uri
                  example: "https://chat.whatsapp.com/xxxxx"
                  description: URL WhatsApp group
      responses:
        '200':
          description: Link grup berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Link grup global berhasil diperbarui"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/link-group-dosen:
    post:
      tags:
        - Link Group
        - Dosen
      summary: Create/Update Link Group Dosen
      description: Membuat atau memperbarui link grup WhatsApp untuk mahasiswa bimbingan (Dosen)
      operationId: createLinkGroupDosen
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - link
              properties:
                type:
                  type: string
                  enum: [TA, KP, BK, alumni]
                  example: "TA"
                  description: Tipe modul
                link:
                  type: string
                  format: uri
                  example: "https://chat.whatsapp.com/xxxxx"
                  description: URL WhatsApp group dosen
      responses:
        '200':
          description: Link grup dosen berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Link grup dosen berhasil diperbarui"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # PENGUMUMAN ENDPOINTS
  # ==========================================

  /v1/pengumuman:
    get:
      tags:
        - Pengumuman
      summary: Get List Pengumuman
      description: |
        Mendapatkan daftar pengumuman dengan pagination dan filter.
        Dapat diakses oleh semua role.
      operationId: getPengumumanList
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          description: Tipe pengumuman berdasarkan modul (ta, kp, bk, alumni)
          required: true
          schema:
            type: string
            enum: [ta, kp, bk, alumni, TA, KP, BK]
            example: "ta"
        - name: page
          in: query
          description: Nomor halaman
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Jumlah data per halaman
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: search
          in: query
          description: Pencarian berdasarkan judul pengumuman
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Berhasil mendapatkan list pengumuman
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Berhasil mendapatkan data pengumuman"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PengumumanDetail'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Pengumuman
        - Koordinator
      summary: Create Pengumuman
      description: Membuat pengumuman baru (Koordinator)
      operationId: createPengumuman
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PengumumanCreate'
      responses:
        '201':
          description: Pengumuman berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Pengumuman berhasil dibuat"
                  data:
                    $ref: '#/components/schemas/PengumumanDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/pengumuman/{id}:
    get:
      tags:
        - Pengumuman
      summary: Get Pengumuman by ID
      description: Mendapatkan detail pengumuman berdasarkan ID
      operationId: getPengumumanById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID pengumuman
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Berhasil mendapatkan detail pengumuman
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Berhasil mendapatkan detail pengumuman"
                  data:
                    $ref: '#/components/schemas/PengumumanDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Pengumuman
        - Koordinator
      summary: Update Pengumuman
      description: Memperbarui pengumuman yang sudah ada (Koordinator)
      operationId: updatePengumuman
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID pengumuman
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PengumumanCreate'
      responses:
        '200':
          description: Pengumuman berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Pengumuman berhasil diperbarui"
                  data:
                    $ref: '#/components/schemas/PengumumanDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Pengumuman
        - Koordinator
      summary: Delete Pengumuman
      description: Menghapus pengumuman dari sistem (Koordinator)
      operationId: deletePengumuman
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID pengumuman
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pengumuman berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Pengumuman berhasil dihapus"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== MAHASISWA ENDPOINTS ====================
  /v1/ta/mahasiswa/dashboard/progress:
    get:
      tags:
        - Dashboard - Mahasiswa
      summary: Get Progress Checklist Mahasiswa
      description: |
        Mengambil data progress checklist mahasiswa dalam bentuk array status.
        Endpoint ini digunakan untuk menampilkan checklist progress TA mahasiswa.
      parameters:
        - name: in_percentage
          in: query
          description: Jika true, akan mengembalikan data dalam bentuk persentase
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Progress berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Progress berhasil diambil"
                  data:
                    oneOf:
                      - type: array
                        description: Array of progress items (when in_percentage=false)
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              example: "Pengajuan TA"
                            status:
                              type: boolean
                              example: true
                            description:
                              type: string
                              example: "Mahasiswa telah mengajukan proposal TA"
                      - type: object
                        description: Progress with percentage (when in_percentage=true)
                        properties:
                          percentage:
                            type: number
                            example: 60
                          completed:
                            type: integer
                            example: 3
                          total:
                            type: integer
                            example: 5
              examples:
                arrayResponse:
                  summary: Array Response
                  value:
                    success: true
                    message: "Progress berhasil diambil"
                    data:
                      - title: "Pengajuan TA"
                        status: true
                        description: "Mahasiswa telah mengajukan proposal TA"
                      - title: "ACC Pembimbing"
                        status: true
                        description: "Pengajuan telah di-ACC oleh dosen pembimbing"
                      - title: "Bimbingan 1"
                        status: false
                        description: "Melakukan bimbingan pertama"
                percentageResponse:
                  summary: Percentage Response
                  value:
                    success: true
                    message: "Progress berhasil diambil"
                    data:
                      percentage: 60
                      completed: 3
                      total: 5
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ta/mahasiswa/dashboard/logbook-count:
    get:
      tags:
        - Dashboard - Mahasiswa
      summary: Get Logbook Count
      description: Mengambil jumlah bab dan bab terakhir dari logbook mahasiswa
      responses:
        '200':
          description: Data logbook count berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logbook berhasil diambil"
                  data:
                    type: object
                    properties:
                      jumlah_bab:
                        type: integer
                        description: Jumlah total bab yang sudah dibuat
                        example: 2
                      bab_terakhir:
                        type: integer
                        description: Nomor bab terakhir yang dikerjakan
                        example: 5
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ta/mahasiswa/dashboard/last-pengajuan:
    get:
      tags:
        - Dashboard - Mahasiswa
      summary: Get Last Pengajuan TA
      description: Mengambil data pengajuan TA terakhir mahasiswa beserta status dan dosen pembimbing
      responses:
        '200':
          description: Data pengajuan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Pengajuan Tugas Akhir berhasil diambil"
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [pending, accepted, rejected]
                        description: Status pengajuan TA
                        example: "accepted"
                      dosen_pembimbing:
                        type: string
                        description: Nama lengkap dosen pembimbing dengan gelar
                        example: "EDY MULYANTO SSi, M.Kom"
                      judul_ta:
                        type: string
                        description: Judul Tugas Akhir
                        example: "Sistem Informasi Manajemen Berbasis Web"
                      tanggal_pengajuan:
                        type: string
                        format: date-time
                        example: "2025-01-10T10:30:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Pengajuan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ta/mahasiswa/dashboard/ringkasan-logbook:
    get:
      tags:
        - Dashboard - Mahasiswa
      summary: Get Ringkasan Logbook
      description: Mengambil ringkasan logbook mahasiswa termasuk jumlah, tanggal terbaru, dan catatan terakhir
      responses:
        '200':
          description: Ringkasan logbook berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
