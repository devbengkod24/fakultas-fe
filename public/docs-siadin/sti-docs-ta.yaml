components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Masukkan token JWT yang diperoleh dari endpoint login.
        Format: Bearer {token}

  schemas:
    # Authentication Schemas
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@mhs.dinus.ac.id"
        roles:
          type: array
          items:
            type: string
          example: ["mahasiswa"]
          description: Array role user (mahasiswa, dosen, koordinator, admin, dll)
        permissions:
          type: array
          items:
            type: string
          example: ["tugas-akhir", "kerja-praktek"]
          description: Array permission/akses user ke modul tertentu
        foto:
          type: string
          nullable: true
          format: uri
          example: "https://example.com/photo.jpg"
          description: URL foto profil user
        created_at:
          type: string
          format: date-time
          example: "2024-01-10T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-10T15:30:00Z"

    PeriodeDetail:
      type: object
      properties:
        id:
          type: integer
          example: 11
        kode_periode:
          type: integer
          description: Kode periode dalam format YYYYS (S=1 ganjil, 2=genap)
          example: 20251
        tahun_ajaran:
          type: string
          example: "2025 - 2026 Ganjil"
        status:
          type: integer
          description: Status periode (1=aktif, 0=tidak aktif)
          example: 1
        tgl_awal:
          type: string
          format: date
          description: Tanggal mulai periode bimbingan
          example: "2025-06-16"
        tgl_akhir:
          type: string
          format: date
          description: Tanggal akhir periode bimbingan
          example: "2025-07-11"
        tgl_awal_ta:
          type: string
          format: date
          description: Tanggal mulai pengerjaan TA
          example: "2025-05-31"
        tgl_akhir_ta:
          type: string
          format: date
          description: Tanggal deadline pengerjaan TA
          example: "2025-08-30"

    PengajuanItem:
      type: object
      properties:
        id:
          type: integer
          example: 123
        mahasiswa_id:
          type: integer
          example: 456
        nim:
          type: string
          example: "2100001234"
        nama_mahasiswa:
          type: string
