  /v1/ta/koor-ta/mahasiswa/sync:
    get:
      tags:
        - Data Mahasiswa
      summary: Sync Mahasiswa from SIADIN
      description: |
        Melakukan sinkronisasi data mahasiswa dari database SIADIN utama.
        Endpoint ini akan mengambil data mahasiswa yang terdaftar di KRS untuk periode aktif.
        
        **Role Access:** Koordinator
        **Note:** 
        - Proses sinkronisasi memakan waktu beberapa detik
        - Data mahasiswa akan diupdate jika sudah ada, atau ditambahkan jika belum ada
      responses:
        '200':
          description: Sinkronisasi mahasiswa berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Sinkronisasi data mahasiswa berhasil"
                  data:
                    type: object
                    properties:
                      total_synced:
                        type: integer
                        description: Jumlah mahasiswa yang berhasil disinkronkan
                        example: 45
                      new_records:
                        type: integer
                        description: Jumlah mahasiswa baru
                        example: 10
                      updated_records:
                        type: integer
                        description: Jumlah mahasiswa yang diupdate
                        example: 35
              examples:
                successResponse:
                  summary: Success Sync
                  value:
                    success: true
                    message: "Berhasil sinkronisasi 45 data mahasiswa"
                    data:
                      total_synced: 45
                      new_records: 10
                      updated_records: 35
                noNewData:
                  summary: No New Data
                  value:
                    success: true
                    message: "Tidak ada data mahasiswa baru untuk disinkronkan"
                    data:
                      total_synced: 0
                      new_records: 0
                      updated_records: 0
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          description: Gagal melakukan sinkronisasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Gagal melakukan sinkronisasi"
                error: "Connection timeout ke database SIADIN"

